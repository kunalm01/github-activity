name: daily-activity

on:
  schedule:
    # GitHub runs scheduled workflows on a best-effort basis and delays or drops the most runs
    # at the top of the hour, so both times sit at :37. The second run is a backup: whichever
    # runs first logs the day, and the other finds it done and exits.
    # Commits are timestamped at random times earlier that day.
    - cron: "37 14 * * *" # 20:07 IST
    - cron: "37 16 * * *" # 22:07 IST
  workflow_dispatch:

permissions:
  contents: write

# Never let the two scheduled runs, or a manual run, overlap.
concurrency:
  group: daily-activity
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make 1 to 6 commits at random times of the day
        env:
          GIT_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${GIT_EMAIL}" ] || [ -z "${GIT_NAME}" ]; then
            echo "Set the GIT_AUTHOR_NAME and GIT_AUTHOR_EMAIL repository variables." >&2
            exit 1
          fi
          git config user.name  "${GIT_NAME}"
          git config user.email "${GIT_EMAIL}"

          # The day being logged, chosen by the same rule as the Python below: today in IST,
          # or yesterday when the run lands before 10:00 IST. Each entry starts with its date.
          if [ "$(TZ=Asia/Kolkata date +%H)" -lt 10 ]; then
            day=$(TZ=Asia/Kolkata date -d yesterday +%F)
          else
            day=$(TZ=Asia/Kolkata date +%F)
          fi
          if grep -q "^${day}" activity.log; then
            echo "${day} is already logged. Nothing to do."
            exit 0
          fi

          # Prints 1 to 6 sorted timestamps between 09:00 and 23:30 IST, never in the future.
          # If the run lands before 10:00 IST (a late or manual run), it uses the previous day.
          python3 - > times.txt <<'PY'
          import datetime as dt
          import random

          ist = dt.timezone(dt.timedelta(hours=5, minutes=30))
          now = dt.datetime.now(ist)
          day = now.date() if now.hour >= 10 else now.date() - dt.timedelta(days=1)
          start = dt.datetime.combine(day, dt.time(9, 0), ist)
          end = min(dt.datetime.combine(day, dt.time(23, 30), ist), now - dt.timedelta(minutes=1))
          n = random.randint(1, 6)
          offsets = sorted(random.sample(range(int((end - start).total_seconds())), n))
          for s in offsets:
              print((start + dt.timedelta(seconds=s)).isoformat(timespec="seconds"))
          PY

          n=$(wc -l < times.txt | tr -d ' ')
          i=0
          while read -r ts; do
            i=$((i + 1))
            echo "${ts} entry ${i}/${n}" >> activity.log
            git add activity.log
            GIT_AUTHOR_DATE="${ts}" GIT_COMMITTER_DATE="${ts}" \
              git commit -q -m "Update activity log (${i}/${n})"
          done < times.txt
          rm times.txt
          git log --format='%ad %s' --date=iso -n "${n}"
          git push
