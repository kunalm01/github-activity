name: daily-activity

on:
  schedule:
    # Once a day at 09:17 UTC. GitHub may delay scheduled runs by a few minutes.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make 1 to 6 commits
        env:
          GIT_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${GIT_EMAIL}" ] || [ -z "${GIT_NAME}" ]; then
            echo "Set the GIT_AUTHOR_NAME and GIT_AUTHOR_EMAIL repository variables." >&2
            exit 1
          fi
          git config user.name  "${GIT_NAME}"
          git config user.email "${GIT_EMAIL}"

          n=$(( RANDOM % 6 + 1 ))
          echo "Making ${n} commit(s)"
          for i in $(seq 1 "${n}"); do
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) entry ${i}/${n}" >> activity.log
            git add activity.log
            git commit -q -m "Update activity log (${i}/${n})"
          done
          git push
